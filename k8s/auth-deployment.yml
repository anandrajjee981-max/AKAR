apiVersion: apps/v1
kind: Deployment
metadata:
  name:  auth-deployment
  labels:
    name:  auth-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - image: auth:latest
          name: auth
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          envFrom:
            - secretRef:
                name: auth-secret
          env:
            - name: PORT
              value: "3009"
          livenessProbe:
            httpGet:
              path: /auth/health
              port: 3009
            initialDelaySeconds: 90
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /auth/health
              port: 3009
            initialDelaySeconds: 30
            timeoutSeconds: 10
          ports:
            - containerPort: 3009
              name: auth
