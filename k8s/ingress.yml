apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orchestrator-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "http://localhost:5173"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PATCH, PUT, DELETE, OPTIONS, HEAD"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Authorization, X-Requested-With, Accept, Origin"
  
  namespace: default
  labels:
    app.kubernetes.io/name: orchestrator
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:

      - pathType: Prefix
        path: /api/sandbox
        backend:
          service:
            name: sandbox-service
            port:
              number: 80


      - pathType: Prefix
        path: /
        backend:
          service:  
            name: frontend-service
            port:
              number: 80
      - pathType: Prefix
        path: /router/health
        backend:
          service:
            name: router-service
            port:
              number: 80
      - pathType: Prefix
        path: /ai/health
        backend:
          service:
            name: ai-service
            port:
              number: 80
      - pathType: Prefix
        path: /ai/generate
        backend:
          service:
            name: ai-service
            port:
              number: 80


  - host: "*.preview.localhost"
    http:
      paths:
      - pathType: Prefix
        path : /
        backend:
          service:
            name: router-service
            port:
              number: 80
  - host: "*.agent.localhost"
    http:
      paths:
      - pathType: Prefix
        path : /
        backend:
          service:
            name: router-service
            port:
              number: 80